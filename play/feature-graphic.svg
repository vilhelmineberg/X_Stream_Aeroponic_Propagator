        <circle cx="400" cy="60" r="26"/>
        <circle cx="570" cy="60" r="26"/>
        <circle cx="740" cy="60" r="26"/>
        <circle cx="910" cy="60" r="26"/>
        <circle cx="60" cy="250" r="26"/>
        <circle cx="910" cy="250" r="26"/>
        <circle cx="60" cy="440" r="26"/>
        <circle cx="230" cy="440" r="26"/>
